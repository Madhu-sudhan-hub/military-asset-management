# application-prod.properties
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:mams}?useSSL=true&requireSSL=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - NEVER use create/update in production!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway Migration (Enabled in production to safely manage schema)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.org.springframework=WARN
logging.level.com.mams=INFO
logging.level.org.hibernate.SQL=WARN

# Security Headers (Spring Boot mostly handles this by default in Spring Security,
# but we can enforce strict transport security if needed via code or properties)
server.error.include-stacktrace=never
server.error.include-message=always
