version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mams-mysql
    environment:
      MYSQL_DATABASE: mams
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mams_secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mams-network

  backend:
    build: ./backend
    container_name: mams-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mams
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-mams_secret}
      - JWT_SECRET=${JWT_SECRET:-9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
    depends_on:
      - db
    networks:
      - mams-network

  frontend:
    build: ./frontend
    container_name: mams-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mams-network

volumes:
  db_data:

networks:
  mams-network:
    driver: bridge
