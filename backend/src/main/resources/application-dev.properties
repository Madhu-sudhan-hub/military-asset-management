# application-dev.properties
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mams}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For development, allow Hibernate to update schema if Flyway is disabled/failing
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration (Disabled by default in dev to prevent conflicts with Hibernate update)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.mams=DEBUG
